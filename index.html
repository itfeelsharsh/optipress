<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiPress — local file tools</title>
  <meta name="description" content="Squeeze, crop, resize, convert and edit images and PDFs entirely in your browser. Exact file sizes, passport presets, merge, split, rotate, watermark and more. Nothing is uploaded.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1ea">

  <meta property="og:type" content="website">
  <meta property="og:title" content="OptiPress — local file tools">
  <meta property="og:description" content="Squeeze, crop, convert and edit images and PDFs on your device. No uploads.">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('optipress:theme:v2');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (err) { /* private mode */ }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preload" href="fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-mono-500-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>

  <script defer src="lib/pdf.min.js"></script>
  <script defer src="lib/pdf-lib.min.js"></script>
  <script defer src="lib/heic2any.min.js"></script>
  <script defer src="lib/jszip.min.js"></script>
  <script defer src="core.js"></script>
  <script defer src="presets.js"></script>
  <script defer src="padding.js"></script>
  <script defer src="compressor.js"></script>
  <script defer src="pdf-tools.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="#/" aria-label="OptiPress — all tools">OptiPress</a>
      <nav class="topnav" aria-label="Primary">
        <a class="nav-link" href="#/">all tools</a>
        <a class="nav-link" href="#/about">about &amp; privacy</a>
        <button type="button" class="theme-btn" id="themeToggle">theme: system</button>
      </nav>
    </div>
  </header>

  <main id="main" class="shell" tabindex="-1"></main>

  <footer class="site-footer">
    <p>Files are processed in this tab. Nothing is uploaded.</p>
    <p class="footer-links">
      <a href="#/">all tools</a>
      <span aria-hidden="true">·</span>
      <a href="#/about">about &amp; privacy</a>
      <span aria-hidden="true">·</span>
      <span>v2.1</span>
    </p>
  </footer>

  <div class="modal" id="compareModal" role="dialog" aria-modal="true" aria-labelledby="compareTitle" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2 class="modal-title" id="compareTitle">quality check</h2>
        <button type="button" class="x-btn" id="closeCompare" aria-label="Close comparison">&times;</button>
      </div>
      <p class="modal-file" id="compareFile"></p>
      <div class="compare" id="compareArea">
        <img class="compare-img" id="compareAfter" alt="Squeezed result">
        <div class="compare-before" id="compareBeforeLayer">
          <img class="compare-img" id="compareBefore" alt="Original file">
        </div>
        <div class="compare-line" id="compareLine">
          <span class="compare-knob" id="compareKnob" role="slider" tabindex="0" aria-label="Comparison position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">&harr;</span>
        </div>
        <span class="compare-tag compare-tag-left">original</span>
        <span class="compare-tag compare-tag-right">squeezed</span>
      </div>
      <dl class="compare-meta">
        <div><dt>original</dt><dd id="compareBeforeMeta">—</dd></div>
        <div><dt>squeezed</dt><dd id="compareAfterMeta">—</dd></div>
        <div><dt>saved</dt><dd id="compareSaved">—</dd></div>
      </dl>
    </div>
  </div>

  <div class="drop-overlay" id="dropOverlay" hidden aria-hidden="true">
    <p>drop files to add them</p>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <p class="sr-only" id="liveStatus" role="status" aria-live="polite"></p>

  <noscript>
    <p class="noscript">OptiPress needs JavaScript. Everything runs locally in your browser, so there is no server to fall back to.</p>
  </noscript>
</body>
</html>
